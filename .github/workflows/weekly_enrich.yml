name: Weekly market-cap refresh

on:
  schedule:
    # Sundays 06:00 UTC — quiet hours, no overlap with daily_update (Mon-Fri 22:30 UTC).
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

concurrency:
  group: ticker-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project dependencies
        run: uv sync

      - name: Run market-cap enrichment
        env:
          SUPABASE_DB_URL_POOLED: ${{ secrets.SUPABASE_DB_URL_POOLED }}
        run: uv run python -m stocks_tracker.enrich
